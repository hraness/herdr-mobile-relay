name: Isolated GNU date formatter diagnosis

on:
  push:
    branches: [codex/herdr-date-format-ci-diag-20261109]

permissions:
  contents: read

jobs:
  same-call-formatter:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      BUN_OPTIONS: --no-env-file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Compare read-only fixed dates and same-call current formatters
        run: bun --no-env-file scripts/diagnostics/gnu-date-format-ci.ts --output diagnostics/gnu-date-format-ci.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-gnu-date-format-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/gnu-date-format-ci.json
          if-no-files-found: error
          retention-days: 1
